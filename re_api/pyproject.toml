[project]
name = "rail-empire-api"
version = "0.1.0"
description = "Rail Empire crash-test backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.111",
    "asyncpg>=0.31",
    "boto3>=1.34",
    "passlib[bcrypt]>=1.7",
    "bcrypt<5.0",
    "pyjwt>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
